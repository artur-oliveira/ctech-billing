name: CI

# What gates a merge. Nothing here deploys and nothing here holds AWS
# credentials — a pull request from a fork runs this, and the deploy roles'
# trust policies exclude pull requests entirely (terraform/github/variables.tf).
#
# Terraform's own validation lives in infra.yml, which already runs on pull
# requests for the same reason.
on:
  pull_request:

# Pull requests only, like ctech-account's ci.yml. A push to main, staging or dev
# is a deploy, and deploy.yml runs its own gates before it ships: the API tests
# (unit and integration, in api.yml) and the UI tests (ctech-cdk's
# frontend-cloudflare.yml). Running this workflow on the same push repeated the
# PR's checks on every merge — docs-only ones included, since this workflow has
# no path filter.
#
# Concurrency matches deploy.yml and the ci.yml in ctech-account and ctech-go-common.
# `cancel-in-progress: false` on purpose: a superseded CI run still tells you
# whether the commit it was started for was good, and that is the commit
# somebody may have already branched from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Only what the change can affect runs. `changes` reads the files the pull
# request touches and the three stages below start only for the code they cover:
# a Terraform, docs or UI-only change does not start the Go suites, and an
# API-only change does not run npm. (infra.yml and proto.yml carry their own path
# filters.) The things two sides read together are listed under both: the event
# catalogue docs/realtime/events.md is parsed by a Go test and a UI test, and the
# wire files are generated for both. A change to this file runs everything.
#
# Static analysis gates the API job (the cheapest check that can fail should fail
# before the DynamoDB container comes up). The UI is independent of the Go side,
# so it runs beside it instead of after it: the wall-clock of a green run is the
# slower of the two, not their sum.
jobs:
  changes:
    name: What changed
    runs-on: ubuntu-26.04-arm
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(git diff --name-only "$BASE" "$HEAD")"
          echo "$files"
          has() { echo "$files" | grep -Eq "$1"; }
          all='^\.github/workflows/ci\.yml$'
          api='^(api/|docs/realtime/|proto/|buf\.yaml$|scripts/generate-proto\.sh$)'
          ui='^(ui/|docs/realtime/|proto/|buf\.yaml$|scripts/generate-proto\.sh$)'
          if has "$all" || has "$api"; then echo "api=true" >> "$GITHUB_OUTPUT"; else echo "api=false" >> "$GITHUB_OUTPUT"; fi
          if has "$all" || has "$ui"; then echo "ui=true" >> "$GITHUB_OUTPUT"; else echo "ui=false" >> "$GITHUB_OUTPUT"; fi

  # No services, no npm, no build tags. Just the checks that need nothing but
  # the source, which is what makes this the right first gate.
  static:
    name: Static analysis
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-26.04-arm
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Also under the integration tag. `go vet ./...` never compiles a
      # build-tagged file, so without this line the integration suite — which is
      # the only place the payment path is exercised end to end — is the least
      # checked code in the repository.
      - name: Vet (integration tag)
        run: go vet -tags integration ./tests/...

      # `@latest` rather than a pinned version, matching ctech-poker's api.yml.
      # The trade is deliberate and worth naming: a new release can turn CI red
      # on a day nobody changed code. That is a morning's annoyance; running a
      # linter a year out of date is a class of bug nobody is looking for.
      # Built against the newest x/tools rather than run with `go run …@latest`:
      # staticcheck's own go.mod pins an x/tools that cannot read a newer Go
      # patch's export data ("export data version 5 is greater than maximum
      # supported version 4" on go1.27.2), so a toolchain bump breaks the linter
      # before staticcheck releases.
      - name: Build staticcheck
        run: |
          dir=$(mktemp -d)
          (cd "$dir" && go mod init staticcheck >/dev/null 2>&1 \
            && go get honnef.co/go/tools/cmd/staticcheck@latest golang.org/x/tools@latest \
            && go build -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck)

      - name: Staticcheck
        run: $RUNNER_TEMP/staticcheck ./...

      - name: Staticcheck (integration tag)
        run: $RUNNER_TEMP/staticcheck -tags integration ./...

      # govulncheck reports only vulnerabilities this code can actually reach,
      # not every advisory touching the dependency tree. That is what makes it
      # safe to fail the build on: the finding is a call path, so there is
      # always something concrete to do about it.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  api:
    name: API
    needs: [changes, static]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-26.04-arm
    defaults:
      run:
        working-directory: api

    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8124:8000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # arm64 with CGO off, which is what the ASG actually runs. A build that
      # only ever succeeds for the runner's own target is not a check that the
      # artifact links.
      - name: Build (arm64 — matches prod)
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/...

      # The release as deploy ships it, held to the size a 1 GB Alpine root
      # can unpack beside the current one (api/scripts/release-size.sh).
      - name: Release size budget
        run: make release-size

      - name: Unit tests
        run: go test ./... -race -count=1

      - name: Integration tests
        env:
          DYNAMODB_ENDPOINT: http://localhost:8124
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_REGION: us-east-1
        run: go test -tags integration -race -count=1 ./tests/integration/

  ui:
    name: UI
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-26.04-arm
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `npm ci`, never `npm install`: it installs the lockfile exactly and
      # fails when package.json and the lockfile disagree, which is the check —
      # a CI that quietly resolves a different tree than a developer has is a CI
      # that tests something nobody is running.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Also the type check: `next build` runs tsc. The environment variables are
      # the deployed shape rather than real values — the build only needs them to
      # exist, and a missing NEXT_PUBLIC_* is an `undefined` baked into the
      # bundle rather than a build failure, which is exactly the class of bug
      # this step is here to catch.
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://billing-api.aoctech.app
          NEXT_PUBLIC_SITE_URL: https://billing.aoctech.app
          NEXT_PUBLIC_CTECH_URL: https://accounts-api.aoctech.app
          NEXT_PUBLIC_CTECH_CLIENT_URL: https://accounts.aoctech.app
          NEXT_PUBLIC_CTECH_CLIENT_ID: billing
        run: npm run build
