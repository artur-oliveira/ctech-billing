name: Frontend

# Called by deploy.yml, which owns the trigger, the path filter and the ordering.
# Never triggered on push.
#
# Replaces the S3 sync + route manifest + CloudFront invalidation with a call to
# ctech-cdk's reusable workflow. The Terraform frontend resources stay applied as
# the rollback target until Phase 4 of the migration plan.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    uses: artur-oliveira/ctech-cdk/.github/workflows/frontend-cloudflare.yml@main
    secrets: inherit
    with:
      service: ctech-billing
      # false because the route on the real hostname is the only public origin this
      # app should have. `wrangler triggers deploy` already disabled workers.dev at
      # cutover; this is what stops the next CI deploy from turning it back on.
      prod-workers-dev: false
      # NEXT_PUBLIC_WS_URL is the realtime socket's host. The CSP match is
      # scheme-exact (https://host does not permit wss://host), and the policy is
      # built from the literals below, so without it the browser refuses every
      # socket and the screens quietly stay on polling.
      # NEXT_PUBLIC_SITE_URL is the app's own origin. It lands in connect-src too,
      # which is harmless — 'self' already covers it.
      build-env-dev: |
        NEXT_PUBLIC_API_URL=https://billing-api-dev.aoctech.app
        NEXT_PUBLIC_WS_URL=wss://billing-api-dev.aoctech.app
        NEXT_PUBLIC_SITE_URL=https://billing-dev.aoctech.app
        NEXT_PUBLIC_CTECH_URL=https://accounts-dev-api.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_URL=https://accounts-dev.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_ID=billing
      build-env-stage: |
        NEXT_PUBLIC_API_URL=https://billing-api-stage.aoctech.app
        NEXT_PUBLIC_WS_URL=wss://billing-api-stage.aoctech.app
        NEXT_PUBLIC_SITE_URL=https://billing-stage.aoctech.app
        NEXT_PUBLIC_CTECH_URL=https://accounts-stage-api.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_URL=https://accounts-stage.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_ID=billing
      # Realtime canary (docs/runbooks/realtime.md#rollout): the last two lines of
      # build-env-prod name the live surfaces, one at a time. No comments inside
      # the block: it is written to the build environment verbatim.
      build-env-prod: |
        NEXT_PUBLIC_API_URL=https://billing-api.aoctech.app
        NEXT_PUBLIC_WS_URL=wss://billing-api.aoctech.app
        NEXT_PUBLIC_SITE_URL=https://billing.aoctech.app
        NEXT_PUBLIC_CTECH_URL=https://accounts-api.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_URL=https://accounts.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_ID=billing
        NEXT_PUBLIC_REALTIME=true
        NEXT_PUBLIC_REALTIME_SURFACES=checkout,console,portal,finance
